mrs_uav_managers:

  world_origin:

    # pin the world_origin to the UAV's home position, determined at runtime from the first
    # usable GNSS/RTK fix (no static units/origin_x/origin_y needed in this mode)
    use_home_position: true

  safety_area_manager:

    safety_area:

      enabled: true

      horizontal:

        # the frame of reference in which the points are expressed
        frame_name: "fixed_origin"

        # polygon
        #
        # x, y [m] for any frame_name except latlon_origin
        # x = latitude, y = longitude [deg]  for frame_name=="latlon_origin"
        points: [
          -5, -5,
          5, -5,
          5, 5,
          -5, 5,
        ]

      vertical:

        # the frame of reference in which the max&min z is expressed
        frame_name: "fixed_origin"

        max_z: 4.0
        min_z: 1.0

      obstacles:

        present: false
